<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div class="title-group">
        <h1>Sudoku Game</h1>
        <p>Play a responsive puzzle with a dark-mode preference that stays saved.</p>
      </div>
      <button id="theme-toggle" class="icon-button" type="button" aria-pressed="false">🌙 Dark Mode</button>
    </header>

    <main class="game-layout">
      <section class="game-panel">
        <div id="sudoku-board"></div>
        <div class="controls">
          <label for="difficulty-select">Difficulty:</label>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
          <button id="new-game">New Game</button>
          <button id="check-solution">Check</button>
          <button id="hint">Hint</button>
          <span class="timer" aria-live="polite">Time: <span id="timer-display">00:00</span></span>
        </div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </section>

      <aside class="leaderboard-card">
        <h2>Top 10 Leaderboard</h2>
        <div class="leaderboard-entry">
          <input id="player-name" type="text" maxlength="20" placeholder="Your name" />
          <button id="save-score">Save</button>
        </div>
        <ol id="leaderboard"></ol>
      </aside>
    </main>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
